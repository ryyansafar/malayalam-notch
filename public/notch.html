<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malayalam in the notch</title>
<link rel="stylesheet" href="notch.css">
</head>
<body>
<i id="fl" class="flare" aria-hidden="true"></i><i id="fr" class="flare r" aria-hidden="true"></i>
<div id="island" class="idle" role="complementary" aria-label="Malayalam in the notch">

  <!-- Collapsed bar: the gap sits over the camera cutout. -->
  <div id="bar" aria-hidden="true">
    <div class="wing left">
      <svg id="wave" class="glyph" viewBox="0 0 24 24"><path d="M4 10v4M9 7v10M14 9v6M19 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="bar-line" class="bar-line">Drop a WhatsApp voice note</span>
    </div>
    <div id="gap"></div>
    <div class="wing right">
      <span id="count" class="count">0</span>
    </div>
  </div>

  <div id="panel">
    <div id="dropzone" class="dropzone">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M9 7v10M14 9v6M19 11v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="drop-text">
        <p id="drop-title" class="drop-title">Release to translate</p>
        <p id="drop-file" class="drop-file"></p>
        <p class="drop-formats">.opus .ogg .m4a .mp3 .wav · up to 30 s</p>
      </div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="card" class="card" aria-live="polite" hidden>
      <div class="card-head">
        <span id="origin-badge" class="badge" hidden></span>
        <span id="lang-badge" class="badge" hidden></span>
        <span id="meta" class="meta"></span>
      </div>
      <p id="ml" class="ml"></p>
      <p id="roman" class="roman"></p>
      <p id="en" class="en"></p>
      <div class="actions">
        <button id="speak" type="button" class="btn primary">Speak</button>
        <button id="copy" type="button" class="btn">Copy</button>
        <button id="mute" type="button" class="btn" aria-pressed="false" title="Mute spoken translations">sound on</button>
      </div>
      <p class="fine">Sarvam cloud · language, not dialect</p>
    </section>

    <div id="shimmer" class="shimmer" hidden><div class="shim"></div></div>

    <section id="v-idle" class="idle-view">
      <p class="muted">Drop a WhatsApp voice note, hold to talk, or type Malayalam below.</p>
    </section>

    <p id="err" class="error" role="alert" hidden></p>

    <div id="controls">
      <div id="langs" role="radiogroup" aria-label="speak the translation in"></div>
      <div class="row">
        <input id="typed" type="text" autocomplete="off" lang="ml" placeholder="Type Malayalam — Enter translates">
        <button id="mic" type="button" class="btn" title="Hold to talk — record up to 25 s">hold to talk</button>
      </div>
      <ul id="shelf" aria-label="recent notes"></ul>
    </div>
  </div>
</div>
<script type="module" src="notch.js"></script>
</body>
</html>
