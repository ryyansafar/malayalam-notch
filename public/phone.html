<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Malayalam in the notch — phone mic</title>
<link rel="manifest" href="phone.webmanifest">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header class="top">
  <span id="conn" class="conn" role="status">
    <span id="conn-dot" class="conn-dot" aria-hidden="true"></span>
    <span id="conn-text">connecting</span>
  </span>
</header>

<main>
  <section class="start" aria-labelledby="h">
    <h1 id="h">Malayalam in the notch</h1>
    <p class="muted">Speak Malayalam into your phone. The result appears in the notch on the Mac and in the archive.</p>
    <button id="hold" class="btn" type="button">HOLD TO TALK</button>
    <p id="status" class="note" role="status"></p>
    <p id="err" class="err" role="alert" hidden></p>
  </section>

  <section id="last" class="last" hidden aria-live="polite">
    <p class="label">last note</p>
    <p id="last-ml" class="ml"></p>
    <p id="last-roman" class="roman"></p>
    <p id="last-en" class="en"></p>
  </section>
</main>

<script type="module" src="phone.js"></script>
</body>
</html>
